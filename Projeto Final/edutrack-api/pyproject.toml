[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edutrack-api"
version = "0.1.0"
description = "API acadêmica do EduTrack com SQL Server e agente de estudos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "pyodbc>=5.2,<6", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "openai>=2,<3",
  "httpx>=0.28,<1", "python-dotenv>=1.0,<2", "cryptography>=46,<47",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pypdf>=6,<7"]

[tool.setuptools.packages.find]
include = ["edutrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
